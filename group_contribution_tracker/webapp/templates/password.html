{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<header>
  <p class="eyebrow">Manager tools</p>
  <h1>Change your password</h1>
</header>
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<section class="panel narrow">
  <section>
    <form method="post" class="grid" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label class="f full">Current password<input id="current" name="current" type="password" required autocomplete="current-password"></label>
      <label class="f full">New password<input id="new" name="new" type="password" required minlength="8" autocomplete="new-password"></label>
      <label class="f full">New password again<input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password"></label>
      <div class="full row-actions"><button type="submit" class="btn primary">Change password</button><a class="btn quiet" href="{{ url_for('manage') }}">Cancel</a></div>
    </form>
  </section>
</section>
{% endblock %}
