{% extends "base.html" %}
{% block title %}Manager sign in{% endblock %}
{% block content %}
<header>
  <p class="eyebrow">Manager tools</p>
  <h1>Manager sign in</h1>
  <p class="desc">Members do not need to sign in. <a href="{{ url_for('public') }}">Back to the ledger.</a></p>
</header>
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<section class="panel narrow">
  <section>
    <form method="post" class="grid">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label class="f full">Username<input id="username" name="username" required autocapitalize="off" autocomplete="username" autofocus></label>
      <label class="f full">Password<input id="password" name="password" type="password" required autocomplete="current-password"></label>
      <div class="full row-actions"><button type="submit" class="btn primary">Sign in</button></div>
    </form>
  </section>
</section>
{% endblock %}
